# INTELRA AI LAB — deploy na Netlify.
# O app Next.js fica em ai-lab/ (a raiz do repositório contém a landing page institucional).
# A Netlify detecta o Next.js e usa o adaptador oficial (OpenNext) automaticamente:
# páginas dinâmicas, server actions e route handlers viram Netlify Functions.

[build]
  base = "ai-lab"
  # Aplica as migrações no Postgres (DATABASE_URL) e gera o build de produção.
  command = "npm run build:netlify"
  publish = ".next"
  # Só reconstrói quando algo dentro de ai-lab/ mudou.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
