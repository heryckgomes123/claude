<!doctype html>
<html>
<head><meta charset="utf-8"><title>items3d</title>
<style>html,body{margin:0;background:#1b2233}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
</head>
<body>
<script type="module">
// Objetos 3D dos presentes (three.js), renderizados uma vez como PNG transparente.
// ?item=heartme | heartplush | star | note | dino      Rodar com: node tools/items.cjs
import * as THREE from 'three';
import { RoomEnvironment } from './node_modules/three/examples/jsm/environments/RoomEnvironment.js';

const Q = new URLSearchParams(location.search);
const ITEM = Q.get('item') || 'heartme';
const OUT = 640, SS = 2;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(OUT * SS, OUT * SS);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.7;
const camera = new THREE.PerspectiveCamera(24, 1, 0.1, 100);
camera.position.set(0, 0.6, 9);
camera.lookAt(0, 0, 0);

scene.add(new THREE.HemisphereLight('#fff4ee', '#30203a', 0.6));
const key = new THREE.DirectionalLight('#fff3e8', 2.6);
key.position.set(-3, 4.5, 5); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -2.5, right: 2.5, top: 2.5, bottom: -2.5, near: 0.5, far: 20 });
key.shadow.bias = -0.0005; key.shadow.normalBias = 0.02;
scene.add(key);
const rim = new THREE.DirectionalLight('#8fe9ff', 1.6); rim.position.set(4, 2, -4); scene.add(rim);
const rim2 = new THREE.DirectionalLight('#ff9fc0', 0.9); rim2.position.set(-4, 0, -3); scene.add(rim2);

const phys = o => new THREE.MeshPhysicalMaterial(o);
const mesh = (geo, mat, parent, pos, rot, scl) => {
  const m = new THREE.Mesh(geo, mat);
  if (pos) m.position.set(...pos);
  if (rot) m.rotation.set(...rot);
  if (scl) m.scale.set(...scl);
  m.castShadow = true; m.receiveShadow = true;
  parent.add(m); return m;
};

function heartShape() {
  const s = new THREE.Shape(), x = -5, y = -9.5;
  s.moveTo(x + 5, y + 5);
  s.bezierCurveTo(x + 5, y + 5, x + 4, y, x, y);
  s.bezierCurveTo(x - 6, y, x - 6, y + 7, x - 6, y + 7);
  s.bezierCurveTo(x - 6, y + 11, x - 3, y + 15.4, x + 5, y + 19);
  s.bezierCurveTo(x + 12, y + 15.4, x + 16, y + 11, x + 16, y + 7);
  s.bezierCurveTo(x + 16, y + 7, x + 16, y, x + 10, y);
  s.bezierCurveTo(x + 7, y, x + 5, y + 5, x + 5, y + 5);
  return s;
}
function heartMesh(mat, parent) {
  const geo = new THREE.ExtrudeGeometry(heartShape(), { depth: 3.2, bevelEnabled: true, bevelThickness: 3.2, bevelSize: 3, bevelSegments: 16, curveSegments: 64 });
  geo.center();
  const m = mesh(geo, mat, parent, [0, 0, 0], [0, 0, Math.PI], [0.105, 0.105, 0.105]);
  return m;
}

const root = new THREE.Group();
scene.add(root);

if (ITEM === 'heartme') {
  // coração vermelho brilhante com óculos escuros e sorriso (Heart Me)
  scene.environmentIntensity = 0.35;
  heartMesh(phys({ color: '#c80a2a', roughness: 0.22, clearcoat: 1, clearcoatRoughness: 0.12, sheen: 0.3, sheenColor: '#ff7090' }), root);
  const black = phys({ color: '#0b0b12', roughness: 0.15, clearcoat: 1, metalness: 0.2 });
  const lens = new THREE.CylinderGeometry(0.42, 0.38, 0.12, 48);
  mesh(lens, black, root, [-0.52, 0.35, 0.86], [Math.PI / 2, 0, 0.12], [1.15, 1, 0.85]);
  mesh(lens, black, root, [0.52, 0.35, 0.86], [Math.PI / 2, 0, -0.12], [1.15, 1, 0.85]);
  mesh(new THREE.BoxGeometry(0.42, 0.1, 0.1), black, root, [0, 0.47, 0.9]);
  const gold = phys({ color: '#ffcf5a', metalness: 1, roughness: 0.25 });
  mesh(new THREE.TorusGeometry(0.43, 0.035, 12, 48), gold, root, [-0.52, 0.35, 0.93], [0, 0, 0], [1.15, 0.85, 1]);
  mesh(new THREE.TorusGeometry(0.43, 0.035, 12, 48), gold, root, [0.52, 0.35, 0.93], [0, 0, 0], [1.15, 0.85, 1]);
  const shine = phys({ color: '#ffffff', emissive: '#ffffff', emissiveIntensity: 0.6, roughness: 0.2 });
  mesh(new THREE.BoxGeometry(0.28, 0.06, 0.02), shine, root, [-0.62, 0.48, 0.95], [0, 0, 0.6]);
  mesh(new THREE.BoxGeometry(0.28, 0.06, 0.02), shine, root, [0.42, 0.48, 0.95], [0, 0, 0.6]);
  const smile = new THREE.TorusGeometry(0.34, 0.06, 16, 48, Math.PI * 0.8);
  mesh(smile, phys({ color: '#4a0010', roughness: 0.4 }), root, [0, -0.12, 0.9], [0, 0, Math.PI + Math.PI * 0.1]);
  mesh(new THREE.SphereGeometry(0.16, 24, 16), phys({ color: '#ff6f8f', roughness: 0.6 }), root, [-0.88, -0.05, 0.72], null, [1, 0.6, 0.4]);
  mesh(new THREE.SphereGeometry(0.16, 24, 16), phys({ color: '#ff6f8f', roughness: 0.6 }), root, [0.88, -0.05, 0.72], null, [1, 0.6, 0.4]);
  root.rotation.set(0.08, -0.32, 0.08);
} else if (ITEM === 'heartplush') {
  // coração de pelúcia macio (Amo você)
  scene.environmentIntensity = 0.3;
  heartMesh(phys({ color: '#e0103e', roughness: 0.85, sheen: 1, sheenColor: '#ffc0d0', sheenRoughness: 0.35 }), root);
  root.rotation.set(0.12, 0.38, -0.1);
} else if (ITEM === 'star') {
  // estrela dourada (Incrível)
  const s = new THREE.Shape();
  for (let i = 0; i < 10; i++) {
    const a = Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 0.52 : 1.25;
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    i ? s.lineTo(x, y) : s.moveTo(x, y);
  }
  s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth: 0.25, bevelEnabled: true, bevelThickness: 0.32, bevelSize: 0.22, bevelSegments: 12, curveSegments: 12 });
  geo.center();
  mesh(geo, phys({ color: '#ffc531', metalness: 1, roughness: 0.18, clearcoat: 0.6 }), root);
  scene.environmentIntensity = 1.1;
  root.rotation.set(0.15, -0.4, 0.12);
} else if (ITEM === 'note') {
  // nota musical com camadas ciano/rosa (TikTok)
  function noteShape() {
    const s = new THREE.Shape();
    const hx = -0.42, hy = -0.78, rx = 0.46, ry = 0.33, ang = -0.42;
    for (let i = 0; i <= 64; i++) {
      const a = Math.PI * 2 * i / 64;
      const x = Math.cos(a) * rx, y = Math.sin(a) * ry;
      const px = hx + x * Math.cos(ang) - y * Math.sin(ang), py = hy + x * Math.sin(ang) + y * Math.cos(ang);
      i ? s.lineTo(px, py) : s.moveTo(px, py);
    }
    const stem = new THREE.Shape();
    stem.moveTo(-0.06, -0.72); stem.lineTo(0.08, -0.72); stem.lineTo(0.08, 1.0);
    stem.bezierCurveTo(0.2, 0.7, 0.62, 0.62, 0.78, 0.25);
    stem.bezierCurveTo(0.86, 0.06, 0.82, -0.14, 0.74, -0.24);
    stem.bezierCurveTo(0.78, 0.08, 0.5, 0.38, 0.08, 0.5);
    stem.lineTo(0.08, -0.72); stem.lineTo(-0.06, -0.72); stem.lineTo(-0.06, 1.12); stem.lineTo(-0.06, -0.72);
    return [s, stem];
  }
  const opts = { depth: 0.18, bevelEnabled: true, bevelThickness: 0.1, bevelSize: 0.06, bevelSegments: 8, curveSegments: 48 };
  const layer = (color, emis, dx, dy, dz) => {
    const grp = new THREE.Group(); grp.position.set(dx, dy, dz); root.add(grp);
    for (const sh of noteShape()) mesh(new THREE.ExtrudeGeometry(sh, opts), phys({ color, emissive: emis, emissiveIntensity: 0.35, roughness: 0.2, clearcoat: 1 }), grp);
  };
  layer('#25f4ee', '#0aa8a4', -0.16, 0.12, -0.08);
  layer('#fe2c55', '#a0102c', 0.16, -0.12, -0.04);
  layer('#ffffff', '#222222', 0, 0, 0);
  root.position.set(-0.1, 0.05, 0);
  root.rotation.set(0.08, -0.22, 0.05);
} else if (ITEM === 'dino') {
  // mini dino de brinquedo, sentado
  const green = phys({ color: '#58c94a', roughness: 0.38, clearcoat: 0.5, clearcoatRoughness: 0.3 });
  const belly = phys({ color: '#e3f5a6', roughness: 0.45, clearcoat: 0.4 });
  const orange = phys({ color: '#ffb23e', roughness: 0.35, clearcoat: 0.5 });
  const dark = phys({ color: '#101418', roughness: 0.1, clearcoat: 1 });
  const white = phys({ color: '#ffffff', emissive: '#ffffff', emissiveIntensity: 0.4 });
  const pink = phys({ color: '#ff8fa8', roughness: 0.7 });
  const S = new THREE.SphereGeometry(1, 64, 48);
  const d = new THREE.Group(); root.add(d);
  mesh(S, green, d, [0, -0.35, 0], null, [0.82, 0.8, 0.72]);              // corpo
  mesh(S, belly, d, [0, -0.38, 0.42], null, [0.55, 0.6, 0.38]);            // barriga
  mesh(S, green, d, [0.05, 0.75, 0.12], null, [0.76, 0.66, 0.68]);         // cabeça
  mesh(S, green, d, [0.1, 0.58, 0.62], null, [0.52, 0.38, 0.42]);          // focinho
  mesh(S, belly, d, [0.1, 0.48, 0.7], null, [0.4, 0.2, 0.3]);              // queixo claro
  for (const sx of [-1, 1]) {
    mesh(S, dark, d, [0.05 + sx * 0.3, 0.92, 0.62], null, [0.13, 0.15, 0.1]);   // olhos
    mesh(S, white, d, [0.01 + sx * 0.3, 0.98, 0.71], null, [0.04, 0.045, 0.03]);
    mesh(S, pink, d, [0.08 + sx * 0.5, 0.6, 0.6], null, [0.12, 0.07, 0.05]);    // bochechas
    mesh(S, dark, d, [0.1 + sx * 0.1, 0.72, 1.02], null, [0.03, 0.025, 0.02]);  // narinas
    const arm = mesh(new THREE.CapsuleGeometry(0.11, 0.22, 8, 16), green, d, [sx * 0.6, -0.1, 0.42], [0.9, 0, -sx * 0.5]);
    mesh(new THREE.CapsuleGeometry(0.2, 0.3, 8, 16), green, d, [sx * 0.45, -0.95, 0.42], [Math.PI / 2 - 0.2, 0, 0]);   // pernas
    mesh(S, belly, d, [sx * 0.45, -1.0, 0.72], null, [0.2, 0.18, 0.08]);   // sola
    for (let k = -1; k <= 1; k++) mesh(S, phys({ color: '#f4f0e0', roughness: 0.3 }), d, [sx * 0.45 + k * 0.08, -0.86, 0.78], null, [0.04, 0.04, 0.04]);
  }
  mesh(new THREE.TorusGeometry(0.16, 0.025, 12, 32, Math.PI * 0.9), dark, d, [0.1, 0.52, 1.0], [0.2, 0, Math.PI * 1.05]);   // sorriso
  // cauda (esferas encadeadas)
  const tail = new THREE.CatmullRomCurve3([new THREE.Vector3(0.3, -0.75, -0.4), new THREE.Vector3(0.75, -0.95, -0.6), new THREE.Vector3(1.2, -0.85, -0.5), new THREE.Vector3(1.45, -0.6, -0.3)]);
  for (let i = 0; i <= 24; i++) { const t = i / 24, p = tail.getPoint(t), r = 0.36 * (1 - t) + 0.06; mesh(S, green, d, [p.x, p.y, p.z], null, [r, r, r]); }
  // espinhos nas costas
  const spike = new THREE.ConeGeometry(0.13, 0.3, 24);
  const spine = new THREE.CatmullRomCurve3([new THREE.Vector3(0.05, 1.38, -0.05), new THREE.Vector3(0.05, 1.1, -0.5), new THREE.Vector3(0.05, 0.3, -0.72), new THREE.Vector3(0.1, -0.5, -0.75), new THREE.Vector3(0.9, -0.85, -0.85)]);
  for (let i = 0; i <= 8; i++) {
    const t = i / 8, p = spine.getPoint(t), tg = spine.getTangent(t);
    const m = mesh(spike, orange, d, [p.x, p.y, p.z]);
    const n = new THREE.Vector3(0, -tg.z, tg.y);
    if (n.z > 0) n.negate();
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), n.normalize());
    m.scale.setScalar(1 - Math.abs(t - 0.35) * 0.6);
  }
  root.rotation.set(0.08, -0.45, 0);
  root.position.set(-0.15, 0.05, 0);
}

// enquadra o objeto
const box = new THREE.Box3().setFromObject(root);
const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
root.position.sub(center);
const fit = Math.max(size.x, size.y) * 1.18;
camera.position.set(0, 0.5, fit / (2 * Math.tan(THREE.MathUtils.degToRad(12))));
camera.lookAt(0, 0, 0);
renderer.render(scene, camera);

const out = document.createElement('canvas'); out.width = OUT; out.height = OUT;
const g = out.getContext('2d'); g.imageSmoothingQuality = 'high';
g.drawImage(renderer.domElement, 0, 0, OUT, OUT);
const px = g.getImageData(0, 0, OUT, OUT).data;
let minX = OUT, maxX = 0, minY = OUT, maxY = 0;
for (let y = 0; y < OUT; y++) for (let x = 0; x < OUT; x++) if (px[(y * OUT + x) * 4 + 3] > 60) {
  minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y);
}
window.RESULT = { png: out.toDataURL('image/png'), bbox: { minX, maxX, minY, maxY } };
if (Q.has('show')) { document.body.innerHTML = ''; document.body.appendChild(out); }
document.title = 'done';
</script>
</body>
</html>
