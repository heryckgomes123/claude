<script>
'use strict';
/*
 * Efeito "Rosa" do mascote Intelra para lives (OBS Browser Source, 1080x1920, fundo transparente).
 *
 * Parâmetros de URL (opcionais):
 *   ?loop=1          repete o efeito sem parar (para testar/posicionar no OBS)
 *   ?autoplay=1      toca uma vez ao carregar (use com "Atualizar navegador quando a cena ficar ativa")
 *   ?nome=Fulano     mostra "Obrigado pela rosa, @Fulano!" (o nome do TikFinity substitui este)
 *   ?legenda=0       nunca mostra a legenda
 *   ?som=0           sem som
 *   ?volume=0.8      volume de 0 a 1
 *   ?ws=0            desliga a conexão automática com o TikFinity
 *   ?ws=ws://...     endereço do WebSocket do TikFinity (padrão ws://localhost:21213/)
 *   ?presente=Rose   nome(s) do presente que dispara, separados por vírgula (padrão Rose,Rosa)
 *   ?fila=10         máximo de efeitos esperando na fila
 * Teclas (OBS > Interagir): Espaço/Enter ou clique = tocar o efeito.
 */
const W = 1080, H = 1920, DUR = 5.0;
const Q = new URLSearchParams(location.search);
const RENDER = Q.has('render');
const cv = document.getElementById('fx');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');

/* ---------- helpers ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const DEG = 180 / Math.PI;
const E = {
  inQuad: t => t * t,
  outQuad: t => 1 - (1 - t) * (1 - t),
  inCubic: t => t * t * t,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inOutCubic: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  outBack: (t, s = 1.70158) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2),
  outExpo: t => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  outElastic: t => (t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI / 3)) + 1),
};
function rng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(h, to, k) {
  const a = hex2rgb(h), b = hex2rgb(to);
  return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], k))).join(',')})`;
}
function rrPath(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; }

/* ---------- mascote em pixel art (voxel) ---------- */
const PAL = {
  K: '#0b1633', W: '#eef2f9', G: '#c2cbdb', H: '#ffffff', V: '#060c1e', U: '#1c2c52',
  C: '#22e5ff', N: '#1d3c9c', P: '#ff3d7f',
};
const CELL = 16;           // tamanho do "pixel" em unidades do mascote
const SS = 2;              // supersampling dos sprites
function grid(w, h) { return Array.from({ length: h }, () => Array(w).fill('.')); }
function rr(g, x, y, w, h, ins, fill, line) {
  const inside = (cx, cy) => {
    if (cx < x || cx >= x + w || cy < y || cy >= y + h) return false;
    const r = cy - y, i = Math.max(ins[r] || 0, ins[h - 1 - r] || 0);
    return cx >= x + i && cx < x + w - i;
  };
  for (let cy = y; cy < y + h; cy++) for (let cx = x; cx < x + w; cx++) {
    if (!inside(cx, cy) || !g[cy] || g[cy][cx] === undefined) continue;
    const edge = line && [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => !inside(cx + dx, cy + dy));
    g[cy][cx] = edge ? line : fill;
  }
}
function put(g, cells, c) { for (const [x, y] of cells) if (g[y] && g[y][x] !== undefined) g[y][x] = c; }
function recolor(g, from, to, y0, y1) { for (let y = y0; y < y1; y++) for (let x = 0; x < g[y].length; x++) if (g[y][x] === from) g[y][x] = to; }

function headGrid() {
  const g = grid(34, 22);
  rr(g, 0, 8, 34, 7, [0], 'W', 'K');                 // orelhas
  rr(g, 3, 0, 28, 22, [6, 4, 2, 1, 1], 'W', 'K');    // capacete
  recolor(g, 'W', 'G', 17, 22);
  put(g, [[10, 1], [11, 1], [12, 1], [13, 1], [8, 2], [9, 2], [6, 3], [7, 3], [5, 4]], 'H');
  rr(g, 7, 5, 20, 12, [2, 1], 'V', 'K');            // visor
  put(g, [[21, 6], [22, 6], [23, 6], [24, 7], [24, 8]], 'U');
  return g;
}
function bodyGrid() {
  const g = grid(24, 13);
  rr(g, 1, 0, 22, 13, [2, 1], 'W', 'K');
  recolor(g, 'W', 'G', 10, 13);
  rr(g, 8, 4, 8, 4, [0], 'C', 'K');
  put(g, [[4, 2], [5, 2], [3, 3]], 'H');
  return g;
}
function armGrid() {
  const g = grid(8, 13);
  rr(g, 1, 0, 6, 8, [1], 'W', 'K');
  rr(g, 0, 6, 8, 7, [1, 0, 0, 0, 0, 0, 1], 'N', 'K');
  put(g, [[4, 10], [4, 11]], 'K');
  put(g, [[2, 7], [2, 8]], '#3a64d6');
  return g;
}
function antennaGrid() {
  const g = grid(5, 10);
  rr(g, 0, 0, 5, 5, [1], 'C', 'K');
  for (let y = 5; y < 10; y++) g[y][2] = 'K';
  return g;
}
function heartGrid() {
  const rows = ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'];
  return rows.map(r => [...r].map(c => (c === 'X' ? 'P' : '.')));
}
function renderSprite(g, cell, depthK = 0.5) {
  const h = g.length, w = g[0].length, depth = Math.round(cell * depthK);
  const c = mkCanvas(w * cell + depth, h * cell + depth), x2 = c.getContext('2d');
  const col = k => PAL[k] || k;
  for (let d = depth; d > 0; d -= 1) for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const k = g[y][x]; if (k === '.') continue;
    x2.fillStyle = mix(col(k), '#000000', 0.62);
    x2.fillRect(x * cell + d, y * cell + d, cell, cell);
  }
  const b = Math.max(1, Math.round(cell * 0.14));
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const k = g[y][x]; if (k === '.') continue;
    const base = col(k), px = x * cell, py = y * cell;
    x2.fillStyle = base; x2.fillRect(px, py, cell, cell);
    x2.fillStyle = mix(base, '#ffffff', 0.32); x2.fillRect(px, py, cell, b);
    x2.fillStyle = mix(base, '#ffffff', 0.16); x2.fillRect(px, py, b, cell);
    x2.fillStyle = mix(base, '#000000', 0.22); x2.fillRect(px, py + cell - b, cell, b);
    x2.fillStyle = mix(base, '#000000', 0.12); x2.fillRect(px + cell - b, py, b, cell);
  }
  return c;
}
// Expressões (células da grade da cabeça, 34x22)
const mirror = cells => cells.concat(cells.map(([x, y]) => [33 - x, y]));
const block = (x0, y0, w, h) => { const o = []; for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) o.push([x, y]); return o; };
const fromRows = (rows, x0, y0) => { const o = []; rows.forEach((r, y) => [...r].forEach((c, x) => { if (c === 'X') o.push([x0 + x, y0 + y]); })); return o; };
const EXPR = {
  logo: { c: PAL.C, cells: mirror([...block(11, 10, 3, 4), [10, 8], [11, 8], [12, 9], [13, 9]]) },
  wide: { c: PAL.C, cells: mirror(block(10, 8, 4, 5).filter(([x, y]) => !((x === 10 || x === 13) && (y === 8 || y === 12)))).concat([[16, 14], [17, 14], [16, 15], [17, 15]]) },
  heart: { c: PAL.P, cells: mirror(fromRows(['.XX.XX.', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'], 9, 8)) },
  happy: { c: PAL.C, cells: mirror([[10, 11], [11, 10], [12, 9], [13, 10], [14, 11], [9, 12], [15, 12], [13, 14], [14, 15], [15, 15], [16, 15]]) },
  blink: { c: PAL.C, cells: mirror(block(11, 12, 3, 1)) },
};
function renderEyes(e, cell) {
  const c = mkCanvas(34 * cell + cell * 2, 22 * cell + cell * 2), x2 = c.getContext('2d');
  const o = cell;
  x2.shadowColor = e.c; x2.shadowBlur = cell * 1.4; x2.fillStyle = e.c;
  for (const [x, y] of e.cells) x2.fillRect(o + x * cell, o + y * cell, cell, cell);
  x2.shadowBlur = 0;
  for (const [x, y] of e.cells) {
    x2.fillStyle = e.c; x2.fillRect(o + x * cell, o + y * cell, cell, cell);
    x2.fillStyle = mix(e.c, '#ffffff', 0.45); x2.fillRect(o + x * cell + cell * 0.2, o + y * cell + cell * 0.2, cell * 0.45, cell * 0.3);
  }
  return c;
}

const ROSE = { W: 400, H: 760, GX: 202, GY: 560, BX: 216, BY: 182 }; // GX/GY = ponto onde a mão segura
function petalSprite() {
  const c = mkCanvas(64, 80), g = c.getContext('2d');
  const gr = g.createRadialGradient(26, 24, 2, 32, 40, 42);
  gr.addColorStop(0, '#f2405a'); gr.addColorStop(0.5, '#b3122b'); gr.addColorStop(1, '#4a020d');
  g.fillStyle = gr;
  g.beginPath(); g.moveTo(32, 76); g.bezierCurveTo(4, 56, 2, 18, 22, 6); g.bezierCurveTo(30, 0, 40, 2, 46, 8);
  g.bezierCurveTo(64, 26, 58, 58, 32, 76); g.fill();
  g.strokeStyle = 'rgba(255,170,180,.55)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(10, 30); g.bezierCurveTo(14, 12, 30, 2, 46, 9); g.stroke();
  return c;
}

/* ---------- assets ---------- */
const SPR = {};
function loadImage(src) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = src; });
}
const ready = (async () => {
  const cell = CELL * SS;
  SPR.head = renderSprite(headGrid(), cell);
  SPR.body = renderSprite(bodyGrid(), cell);
  SPR.arm = renderSprite(armGrid(), cell);
  SPR.ant = renderSprite(antennaGrid(), cell);
  SPR.heart = renderSprite(heartGrid(), 12, 0.35);
  SPR.eyes = {};
  for (const k in EXPR) SPR.eyes[k] = renderEyes(EXPR[k], cell);
  SPR.petal = petalSprite();
  const img = await loadImage(ROSE_PNG);
  SPR.rose = mkCanvas(ROSE.W * 2, ROSE.H * 2);
  SPR.rose.getContext('2d').drawImage(img, 0, 0, ROSE.W * 2, ROSE.H * 2);
})();

/* ---------- linha do tempo ---------- */
const T = {
  portal: 0.0, panelIn: 0.3, roseIn: 0.55, notice: 0.75, wide: 0.85, heart: 1.0,
  reach: 1.05, contact: 1.52, pullEnd: 2.15, shatter: 1.82, happy: 3.0,
  wave: 3.05, antic: 3.8, launch: 4.05, gone: 4.55,
};
const BASE = { x: 330, y: 1500, sc: 0.8 };
const REACH = { x: 455, y: 1238 };     // onde o mascote para para pegar a rosa
const PANEL = { x: 760, y: 1000, w: 440, h: 560, rot: -3 };
const SHOULDER_R = [232, 74], SHOULDER_L = [-232, 74], HAND = 128;
const ARM_HOLD = -150;

function roseScreen(t) {
  const p = seg(t, T.roseIn, T.roseIn + 0.45);
  const tt = Math.min(t, T.contact);
  return {
    x: 760 + Math.sin(tt * 2.1) * 6,
    y: 1222 + Math.sin(tt * 2.7) * 8,
    rot: -6 + Math.sin(tt * 1.9) * 3,
    sc: 1.15 * E.outElastic(p),
    sx: 0.94 + 0.06 * Math.cos(tt * 2.4),
  };
}
function robotMatrix(s) {
  return new DOMMatrix().translate(s.x, s.y).rotate(s.rot).scale(s.sc * s.sx, s.sc * s.sy);
}
function armAim(M, shoulder, wx, wy) {
  const inv = M.inverse(), p = inv.transformPoint(new DOMPoint(wx, wy));
  const dx = p.x - shoulder[0], dy = p.y - shoulder[1];
  return { ang: Math.atan2(-dx, dy) * DEG, len: Math.hypot(dx, dy) / HAND };
}
function robotState(t) {
  const s = { x: BASE.x, y: BASE.y, sc: BASE.sc, sx: 1, sy: 1, rot: 0, head: 0, armL: 10, armR: -10, armRS: 1, armLS: 1, expr: 'logo', diss: 1, visible: t >= 0.05 && t < T.gone + 0.2 };
  // entrada
  const pin = seg(t, 0.08, 0.7);
  s.y += 140 * (1 - E.outBack(pin));
  s.sc *= 0.65 + 0.35 * E.outBack(pin);
  s.diss = seg(t, 0.08, 0.62);
  // flutuação
  s.y += Math.sin(t * 3.4) * 9;
  s.rot += Math.sin(t * 2.2) * 1.5;
  s.armL += Math.sin(t * 3.4 + 1) * 4;
  s.armR -= Math.sin(t * 3.4 + 1) * 4;
  // percebe a rosa
  const nt = E.outCubic(seg(t, T.notice, T.notice + 0.25));
  s.head += 7 * nt;
  // alcança
  const ant = Math.sin(Math.PI * seg(t, 0.9, 1.1));
  s.armR += 18 * ant;
  const r = E.inOutCubic(seg(t, T.reach, T.contact));
  const back = E.inOutCubic(seg(t, T.contact + 0.05, T.pullEnd));
  const lean = r * (1 - back);
  s.x += (REACH.x - BASE.x) * lean; s.y += (REACH.y - BASE.y) * lean; s.rot += 9 * lean; s.sc *= 1 + 0.16 * lean;
  // recuo depois de puxar
  const recoil = Math.sin(Math.PI * seg(t, T.contact + 0.05, T.pullEnd + 0.15));
  s.rot -= 6 * recoil;
  // segurando
  const hold = seg(t, T.pullEnd, T.antic);
  if (t >= T.pullEnd) {
    const ht = t - T.pullEnd;
    s.rot += 4 * Math.sin(ht * 4.2) * (1 - seg(t, T.antic - 0.2, T.antic));
    s.head = lerp(7, 10, E.outCubic(seg(t, T.pullEnd, T.pullEnd + 0.3))) + 2 * Math.sin(ht * 4.2 + 0.6);
    const bounce = Math.sin(Math.PI * seg(t, T.pullEnd, T.pullEnd + 0.3));
    s.sy *= 1 - 0.06 * bounce; s.sx *= 1 + 0.05 * bounce;
  }
  // tchauzinho com o braço esquerdo
  const wv = seg(t, T.wave, T.wave + 0.2) * (1 - seg(t, T.antic - 0.1, T.antic + 0.1));
  s.armL = lerp(s.armL, 150 + 22 * Math.sin((t - T.wave) * 19), E.outCubic(wv));
  // braço direito: mira na rosa e depois traz para perto
  // a mira é calculada na pose do contato, para o braço não esticar demais no caminho
  const target = roseScreen(T.contact);
  const aim = t === T.contact ? armAim(robotMatrix(s), SHOULDER_R, target.x, target.y) : contactAim();
  if (t < T.contact + 0.05) {
    s.armR = lerp(s.armR, aim.ang, r);
    s.armRS = lerp(1, aim.len, r);
  } else {
    // mira congelada no contato: recalcula com a pose do momento do contato
    const sc = aim;
    const k = E.inOutCubic(seg(t, T.contact + 0.05, T.pullEnd));
    s.armR = lerp(sc.ang, ARM_HOLD + 3 * Math.sin((t - T.pullEnd) * 4.2), k);

  }
  // antecipação e decolagem
  const a = Math.sin(Math.PI * 0.5 * seg(t, T.antic, T.launch)) * (1 - seg(t, T.launch, T.launch + 0.08));
  s.sy *= 1 - 0.12 * a; s.sx *= 1 + 0.09 * a; s.y += 28 * a;
  s.armL = lerp(s.armL, 30, seg(t, T.antic, T.launch));

}
function drawTrail(g, t) {
  if (t < T.launch) return;
  g.globalCompositeOperation = 'lighter';
  // cauda de luz
  const pts = [];
  for (let i = 0; i <= 14; i++) {
    const tt = Math.max(T.launch, t - i * 0.022);
    const s = robotState(tt), M = robotMatrix(s), p = M.transformPoint(new DOMPoint(0, -60));
    pts.push(p);
  }
  const fade = 1 - seg(t, T.gone, T.gone + 0.25);
  for (let pass = 0; pass < 2; pass++) {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.lineCap = 'round'; g.lineJoin = 'round';
    for (let i = 0; i < pts.length - 1; i++) {
      const k = 1 - i / pts.length;
      g.strokeStyle = pass ? `rgba(255,255,255,${0.85 * k * fade})` : `rgba(34,229,255,${0.5 * k * fade})`;
      g.lineWidth = (pass ? 14 : 60) * k;
      g.beginPath(); g.moveTo(pts[i].x, pts[i].y); g.lineTo(pts[i + 1].x, pts[i + 1].y); g.stroke();
    }
  }
  for (const p of TRAIL) {
    const lt = t - p.t0; if (lt < 0 || lt > p.life) continue;
    const s = robotState(p.t0), o = robotMatrix(s).transformPoint(new DOMPoint(0, 0));
    const k = lt / p.life;
    g.setTransform(1, 0, 0, 1, o.x + p.dx + p.vx * lt, o.y + p.dy + p.vy * lt);
    g.fillStyle = p.white ? `rgba(255,255,255,${1 - k})` : `rgba(34,229,255,${1 - k})`;
    const sz = p.size * (1 - k);
    g.fillRect(-sz / 2, -sz / 2, sz, sz);
  }
  g.globalCompositeOperation = 'source-over'; g.setTransform(1, 0, 0, 1, 0, 0);
}
function drawCaption(g, t, info) {
  if (!info || !info.nome) return;
  const a = E.outCubic(seg(t, 2.3, 2.6)) * (1 - seg(t, 4.1, 4.4));
  if (a <= 0) return;
  const y = 1745 + 30 * (1 - a);
  g.save();
  g.globalAlpha = a;
  g.setTransform(1, 0, 0, 1, W / 2, y);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const name = '@' + info.nome.replace(/^@/, '').slice(0, 24) + (info.count > 1 ? `  x${info.count}` : '');
  g.font = '800 58px "Segoe UI", system-ui, -apple-system, sans-serif';
  const tw = Math.max(g.measureText(name).width, 420) + 90;
  rrPath(g, -tw / 2, -78, tw, 150, 34);
  g.fillStyle = 'rgba(6,12,30,.72)'; g.fill();
  g.shadowColor = '#22e5ff'; g.shadowBlur = 24; g.strokeStyle = 'rgba(34,229,255,.85)'; g.lineWidth = 3; g.stroke();
  g.shadowBlur = 0;
  g.font = '600 32px "Segoe UI", system-ui, -apple-system, sans-serif';
  g.fillStyle = '#cfefff'; g.fillText('Obrigado pela rosa 🌹', 0, -34);
  g.font = '800 58px "Segoe UI", system-ui, -apple-system, sans-serif';
  const gr = g.createLinearGradient(-tw / 2, 0, tw / 2, 0);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#22e5ff');
  g.fillStyle = gr; g.fillText(name, 0, 24);
  g.restore();
}

function draw(t, info) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, H);
  if (t < 0 || t >= DUR) return;
  const s = robotState(t);
  drawPortal(ctx, t);
  drawPanel(ctx, t);
  const held = t >= T.contact;
  if (!held) {
    const r = roseTransform(t, s);
    drawRose(ctx, r);
    drawGlints(ctx, t, GLINTS, { x: r.x, y: r.y }, '255,220,230');
  }
  drawShards(ctx, t);
  if (s.visible) {
    if (t > T.launch) {
      for (let k = 5; k >= 1; k--) {
        const tt = t - k * 0.016;
        renderRobotLayer(tt, robotState(tt), true);
        ctx.globalAlpha = 0.16 * (6 - k) / 5;
        ctx.drawImage(RL, 0, 0);
      }
      ctx.globalAlpha = 1;
    }
    renderRobotLayer(t, s, held);
    ctx.drawImage(RL, 0, 0);
    if (s.diss < 1) {
      const M = robotMatrix(s);
      ctx.setTransform(M);
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = 'rgba(120,240,255,.85)';
      ctx.beginPath();
      for (const b of DISS) if (b.th >= s.diss && b.th < s.diss + 0.09) ctx.rect(b.x + 3, b.y + 3, 21, 21);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }
  }
  drawPortalSparks(ctx, t);
  const hand = handWorld(s);
  if (held) {
    const c = roseScreen(T.contact);
    drawRipples(ctx, t, c.x, c.y);
    ctx.globalCompositeOperation = 'lighter';
    flare(ctx, c.x, c.y, 380, Math.exp(-(t - T.contact) * 7));
    ctx.globalCompositeOperation = 'source-over';
    drawPetals(ctx, t, { x: c.x, y: c.y - 330 });
    if (t < T.antic + 0.3) {
      const r = roseTransform(t, s);
      const bloom = new DOMMatrix().translate(r.x, r.y).rotate(r.rot).scale(r.sc).transformPoint(new DOMPoint(0, -(ROSE.GY - ROSE.BY)));
      drawHearts(ctx, t, { x: bloom.x - 60, y: bloom.y - 40 });
      drawGlints(ctx, t, HOLD_GLINTS, { x: hand.x - 40, y: hand.y }, '255,200,220');
    }
  }
  drawTrail(ctx, t);
  if (t > T.launch && t < T.launch + 0.5) {
    ctx.globalCompositeOperation = 'lighter';
    const o = robotMatrix(robotState(T.launch)).transformPoint(new DOMPoint(0, 0));
    flare(ctx, o.x, o.y + 120, 320, 0.9 * Math.exp(-(t - T.launch) * 8));
    ctx.globalCompositeOperation = 'source-over';
  }
  drawCaption(ctx, t, info);
  // garante que o último quadro termine 100% transparente
  const endFade = 1 - seg(t, 4.72, 4.94);
  if (endFade < 1) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'destination-in';
    ctx.fillStyle = `rgba(0,0,0,${endFade})`;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

/* ---------- som (WebAudio sintetizado) ---------- */
function scheduleAudio(ac, dest, t0) {
  const out = ac.createGain(); out.gain.value = 0.9;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.15;
  out.connect(comp); comp.connect(dest);
  const R = rng(99);
  const nb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = R() * 2 - 1;
  const panned = pan => { if (!pan || !ac.createStereoPanner) return out; const p = ac.createStereoPanner(); p.pan.value = pan; p.connect(out); return p; };
  function noise(at, dur, f0, f1, q, gain, type = 'bandpass', pan = 0) {
    const s = ac.createBufferSource(); s.buffer = nb;
    const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q;
    f.frequency.setValueAtTime(f0, t0 + at); f.frequency.exponentialRampToValueAtTime(f1, t0 + at + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0 + at);
    g.gain.exponentialRampToValueAtTime(gain, t0 + at + dur * 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur);
    s.connect(f); f.connect(g); g.connect(panned(pan));
    s.start(t0 + at, R() * 0.5); s.stop(t0 + at + dur + 0.05);
  }
  function tone(at, dur, f0, f1, type, gain, attack = 0.005, pan = 0) {
    const o = ac.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t0 + at);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + at + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0 + at);
    g.gain.linearRampToValueAtTime(gain, t0 + at + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur);
    o.connect(g); g.connect(panned(pan));
    o.start(t0 + at); o.stop(t0 + at + dur + 0.05);
  }
  // portal
  noise(0.0, 0.75, 250, 2600, 1.2, 0.45, 'bandpass', -0.4);
  tone(0.0, 0.7, 70, 210, 'sine', 0.5, 0.06);
  tone(0.04, 0.55, 140, 420, 'triangle', 0.12, 0.05);
  for (let i = 0; i < 6; i++) tone(0.14 + i * 0.065, 0.05, 700 + i * 170, 700 + i * 170, 'square', 0.035, 0.002, -0.3);
  // janela aparece
  noise(0.3, 0.16, 3000, 7000, 3, 0.18, 'highpass', 0.4);
  tone(0.3, 0.12, 1800, 2400, 'square', 0.03, 0.002, 0.4);
  // rosa surge
  tone(0.55, 0.22, 480, 1350, 'sine', 0.32, 0.004, 0.35);
  noise(0.55, 0.1, 5000, 9000, 1, 0.16, 'highpass', 0.35);
  [2093, 2637, 3136, 4186].forEach((f, i) => tone(0.66 + i * 0.055, 0.45, f, f, 'sine', 0.06, 0.003, 0.4));
  // reações
  tone(0.85, 0.09, 1100, 1800, 'square', 0.045, 0.002);
  tone(1.0, 0.28, 520, 980, 'triangle', 0.14, 0.004);
  // alcança
  noise(1.05, 0.48, 400, 3200, 2, 0.32, 'bandpass', 0.3);
  // toque no vidro
  tone(T.contact, 1.3, 2600, 2600, 'sine', 0.22, 0.002, 0.35);
  tone(T.contact, 1.0, 3900, 3880, 'sine', 0.12, 0.002, 0.35);
  tone(T.contact, 0.8, 5200, 5150, 'sine', 0.07, 0.002, 0.35);
  tone(T.contact, 0.35, 150, 55, 'sine', 0.55, 0.003);
  noise(T.contact, 0.3, 1800, 500, 0.8, 0.35);
  // puxada
  noise(T.contact + 0.05, 0.6, 4500, 450, 1.4, 0.42, 'bandpass', 0.2);
  // vidro se desfaz
  for (let i = 0; i < 16; i++) { const f = 3000 + R() * 4500; tone(T.shatter + 0.1 + R() * 0.35, 0.12 + R() * 0.2, f, f * 0.97, 'sine', 0.045, 0.001, 0.2 + R() * 0.5); }
  noise(T.shatter + 0.1, 0.4, 7000, 3000, 1, 0.2, 'highpass', 0.4);
  // pegou! bipes felizes + acorde
  tone(T.pullEnd, 0.1, 660, 990, 'square', 0.06, 0.002);
  tone(T.pullEnd + 0.11, 0.13, 990, 1320, 'square', 0.06, 0.002);
  [1046.5, 1318.5, 1568, 2093].forEach((f, i) => tone(T.pullEnd + 0.18 + i * 0.09, 0.7, f, f, 'triangle', 0.09, 0.004));
  for (let i = 0; i < 6; i++) tone(T.pullEnd + 0.25 + i * 0.14, 0.12, 1500 + (i % 3) * 300, 1900 + (i % 3) * 300, 'sine', 0.05, 0.003, -0.2);
  // tchau
  tone(T.happy, 0.08, 880, 1760, 'square', 0.05, 0.002);
  tone(T.happy + 0.1, 0.08, 1760, 1320, 'square', 0.05, 0.002);
  tone(T.happy + 0.2, 0.14, 1320, 1980, 'square', 0.05, 0.002);
  // carga e decolagem
  tone(T.antic, 0.3, 180, 620, 'sawtooth', 0.05, 0.02);
  noise(T.launch, 0.6, 450, 6500, 1.5, 0.5, 'bandpass', 0.6);
  tone(T.launch, 0.5, 260, 1700, 'sine', 0.22, 0.01, 0.6);
  [3136, 2637, 2093, 3520].forEach((f, i) => tone(T.launch + 0.35 + i * 0.07, 0.32, f, f, 'sine', 0.045, 0.003, 0.7));
}
async function renderAudioWav() {
  const sr = 48000, oac = new OfflineAudioContext(2, Math.ceil(sr * DUR), sr);
  scheduleAudio(oac, oac.destination, 0);
  const buf = await oac.startRendering();
  const n = buf.length, L = buf.getChannelData(0), Rr = buf.getChannelData(1);
  const ab = new ArrayBuffer(44 + n * 4), v = new DataView(ab);
  const ws = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  ws(0, 'RIFF'); v.setUint32(4, 36 + n * 4, true); ws(8, 'WAVE'); ws(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true); v.setUint32(24, sr, true);
  v.setUint32(28, sr * 4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true); ws(36, 'data'); v.setUint32(40, n * 4, true);
  for (let i = 0, o = 44; i < n; i++, o += 4) {
    v.setInt16(o, clamp(L[i], -1, 1) * 32767, true);
    v.setInt16(o + 2, clamp(Rr[i], -1, 1) * 32767, true);
  }
  let bin = ''; const u8 = new Uint8Array(ab);
  for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(bin);
}

/* ---------- player ao vivo ---------- */
const SOUND = Q.get('som') !== '0';
const VOLUME = clamp(parseFloat(Q.get('volume') || '0.8'));
const CAPTION = Q.get('legenda') !== '0';
const MAXQ = parseInt(Q.get('fila') || '10', 10);
const GIFTS = (Q.get('presente') || 'Rose,Rosa').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
const queue = [];
let playing = null, ac = null;

function enqueue(info = {}) {
  if (queue.length >= MAXQ) return;
  queue.push({ nome: CAPTION ? (info.nome ?? Q.get('nome') ?? '') : '', count: info.count || 1 });
  if (!playing) next();
}
function next() {
  const item = queue.shift();
  if (!item) { playing = null; draw(-1); return; }
  playing = { item, start: performance.now() };
  if (SOUND) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const g = ac.createGain(); g.gain.value = VOLUME; g.connect(ac.destination);
      scheduleAudio(ac, g, ac.currentTime + 0.02);
    } catch (e) { /* sem áudio */ }
  }
  requestAnimationFrame(tick);
}
function tick(now) {
  if (!playing) return;
  const t = (now - playing.start) / 1000;
  if (t >= DUR) {
    draw(-1);
    if (Q.get('loop') === '1') setTimeout(() => enqueue({}), 700);
    next();
    return;
  }
  draw(t, playing.item);
  requestAnimationFrame(tick);
}
// Integração automática com o TikFinity (WebSocket local)
function connectTikFinity() {
  const url = Q.get('ws') || 'ws://localhost:21213/';
  if (url === '0') return;
  let ws;
  try { ws = new WebSocket(url); } catch (e) { setTimeout(connectTikFinity, 5000); return; }
  ws.onmessage = ev => {
    let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
    const type = (msg.event || msg.type || '').toLowerCase();
    if (type !== 'gift') return;
    const d = msg.data || msg;
    const name = String(d.giftName || (d.gift && d.gift.name) || '').toLowerCase();
    if (!GIFTS.includes(name) && String(d.giftId) !== Q.get('giftId')) return;
    // presentes em sequência (combo): toca uma vez quando o combo termina
    if (d.giftType === 1 && d.repeatEnd === false) return;
    enqueue({ nome: d.nickname || d.uniqueId || '', count: d.repeatCount || 1 });
  };
  ws.onclose = () => setTimeout(connectTikFinity, 3000);
  ws.onerror = () => { try { ws.close(); } catch (e) { /* noop */ } };
}

ready.then(() => {
  if (RENDER) {
    window.FX = {
      DUR, W, H,
      frame(t, nome) { draw(t, nome ? { nome, count: 1 } : null); return cv.toDataURL('image/png'); },
      sheet(times, cols, scale, bg = '#1b2233') {
        const rows = Math.ceil(times.length / cols), sw = W * scale, sh = H * scale;
        const c = mkCanvas(cols * sw, rows * sh), g = c.getContext('2d');
        g.fillStyle = bg; g.fillRect(0, 0, c.width, c.height);
        times.forEach((t, i) => {
          draw(t, null);
          const x = (i % cols) * sw, y = Math.floor(i / cols) * sh;
          g.drawImage(cv, x, y, sw, sh);
          g.fillStyle = '#fff'; g.font = '24px monospace'; g.fillText(t.toFixed(2) + 's', x + 10, y + 30);
          g.strokeStyle = '#444'; g.strokeRect(x, y, sw, sh);
        });
        return c.toDataURL('image/png');
      },
      audio: renderAudioWav,
      debug(t) { const s = robotState(t); return { armR: s.armR, armRS: s.armRS, x: s.x, y: s.y }; },
      rose(scale) { const c = mkCanvas(ROSE.W * scale, ROSE.H * scale), g = c.getContext('2d'); g.fillStyle = '#1b2233'; g.fillRect(0, 0, c.width, c.height); g.drawImage(SPR.rose, 0, 0, c.width, c.height); return c.toDataURL('image/png'); },
      crop(t, x, y, w, h, bg = '#1b2233') { draw(t, null); const c = mkCanvas(w, h), g = c.getContext('2d'); g.fillStyle = bg; g.fillRect(0, 0, w, h); g.drawImage(cv, -x, -y); return c.toDataURL('image/png'); },
    };
    document.title = 'ready';
    return;
  }
  addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') enqueue({}); });
  addEventListener('pointerdown', () => enqueue({}));
  connectTikFinity();
  if (Q.get('loop') === '1' || Q.get('autoplay') === '1') enqueue({});
});
