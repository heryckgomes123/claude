    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Bodemania" />
    <meta property="og:title" content="Bodemania — Artigos maçônicos & impressão 3D" />
    <meta property="og:description" content="Tradição com acabamento de respeito. E se dá pra imaginar, dá pra imprimir." />

    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #faf7f0;
        transition: opacity 0.45s ease, visibility 0.45s;
        animation: boot-fallback 0.4s 4s forwards;
      }
      #boot[data-state='done'] {
        opacity: 0;
        visibility: hidden;
      }
      #boot span {
        font: 700 22px/1 Georgia, serif;
        color: #0d1a2b;
        letter-spacing: -0.02em;
      }
      #boot span b {
        color: #a47b25;
      }
      #boot i {
        display: block;
        margin: 14px auto 0;
        width: 56px;
        height: 2px;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #c79b3b, transparent);
        animation: boot-line 1.1s ease-in-out infinite;
      }
      @keyframes boot-line {
        0%, 100% { opacity: 0.25; transform: scaleX(0.4); }
        50% { opacity: 1; transform: scaleX(1); }
      }
      @keyframes boot-fallback {
        to { opacity: 0; visibility: hidden; }
      }
    </style>
    <noscript><style>#boot { display: none; }</style></noscript>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><div><span>Bode<b>mania</b></span><i></i></div></div>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui">A Bodemania precisa do JavaScript ativado para funcionar.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
