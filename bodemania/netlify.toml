# ===========================
# NETLIFY CONFIGURATION
# ===========================
# Deployment, redirects, headers, environment variables

[build]
  command = "npm run build"
  publish = "dist"
  # Environment: Set VITE_* variables in Netlify UI → Settings → Build & Deploy → Environment

[build.environment]
  # Node version
  NODE_VERSION = "22"
  # NPM version
  NPM_VERSION = "10"

# ===========================
# REDIRECTS (SPA Support)
# ===========================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Health check (optional)
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

# ===========================
# SECURITY HEADERS
# ===========================
[[headers]]
  for = "/*"
  [headers.values]
    # Content Security Policy - Prevents XSS, data injection, etc
    # default-src 'self' - only load from same origin
    # script-src - allow inline (React needs it) + external CDNs if needed
    # style-src - allow inline (Tailwind needs it)
    # img-src - allow self + https images + data URIs
    # connect-src - API calls allowed to Supabase + Analytics
    # frame-src - deny all iframes (prevent clickjacking)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co https://www.google-analytics.com https://region1.google-analytics.com https://api.mercadopago.com https://sdk.mercadopago.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    # Don't allow this site to be framed in other sites (clickjacking protection)
    X-Frame-Options = "DENY"

    # Prevent MIME type sniffing (security vulnerability)
    X-Content-Type-Options = "nosniff"

    # Enable XSS filter in older browsers
    X-XSS-Protection = "1; mode=block"

    # Force HTTPS (set for 1 year)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Don't send full referrer to other sites (privacy)
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Deny access to sensitive features
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"

    # Allow compression
    Access-Control-Allow-Headers = "*"

# ===========================
# CACHE SETTINGS
# ===========================

# HTML (no cache, always fresh)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"

# JS/CSS (long cache, versioned by Vite)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, immutable, max-age=31536000"

# Images (1 year cache)
[[headers]]
  for = "/**/*.{jpg,jpeg,png,gif,webp,svg,ico}"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Fonts (1 year cache)
[[headers]]
  for = "/**/*.{woff,woff2,ttf,eot,otf}"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# ===========================
# CONTEXT-SPECIFIC SETTINGS
# ===========================

# Production
[context.production]
  command = "npm run build"
  # Environment variables set in Netlify UI

# Deploy preview (staging)
[context.deploy-preview]
  command = "npm run build"

# Branch deploy
[context.branch-deploy]
  command = "npm run build"

# ===========================
# FUNCTIONS (Optional - for backend logic)
# ===========================
# If you need serverless functions, uncomment:
# [[functions]]
#   directory = "netlify/functions"
#   node_bundler = "esbuild"
