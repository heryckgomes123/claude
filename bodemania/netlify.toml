# ===========================
# NETLIFY CONFIGURATION
# ===========================
# Variáveis VITE_* ficam no painel: Site configuration → Environment variables.
# Base directory no painel: "bodemania" (o repositório tem outro projeto na raiz).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ===========================
# SPA: toda rota sem arquivo cai no index.html (arquivos reais têm prioridade)
# ===========================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ===========================
# SECURITY HEADERS
# ===========================
[[headers]]
  for = "/*"
  [headers.values]
    # Domínios liberados (testados com scripts de navegador):
    #  - Supabase: API, Edge Functions, Storage e Realtime (wss)
    #  - Mercado Pago: SDK de cartão + antifraude (mercadopago/mercadolibre/mlstatic, inclusive iframes)
    #  - ViaCEP: preenchimento de endereço pelo CEP
    #  - Google Analytics 4 (só carrega com consentimento de cookies)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://*.mercadopago.com https://*.mercadolibre.com https://*.mlstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://viacep.com.br https://*.mercadopago.com https://*.mercadolibre.com https://*.mlstatic.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-src https://*.mercadopago.com https://*.mercadolibre.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"

# ===========================
# CACHE
# ===========================
# Arquivos do Vite têm hash no nome → cache eterno é seguro.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
