<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>INTELRA Digital — Estratégia, Conteúdo, Tráfego, IA e Tecnologia</title>
    <meta
      name="description"
      content="A INTELRA cria soluções digitais para empresas: marketing, inteligência artificial, desenvolvimento, automação e presença digital."
    />
    <meta name="theme-color" content="#070707" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="INTELRA Digital" />
    <meta property="og:title" content="INTELRA Digital — Estratégia, Conteúdo, Tráfego, IA e Tecnologia" />
    <meta
      property="og:description"
      content="Marketing, inteligência artificial, desenvolvimento, automação e presença digital para empresas que querem evoluir."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="INTELRA — Seu negócio. Mais inteligente." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="INTELRA Digital — Estratégia, Conteúdo, Tráfego, IA e Tecnologia" />
    <meta
      name="twitter:description"
      content="Marketing, inteligência artificial, desenvolvimento, automação e presença digital para empresas que querem evoluir."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.png" />

    <!-- Structured data (JSON-LD) é injetado no build a partir de src/data — ver vite.config.ts -->

    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #070707;
        transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.6s;
        animation: boot-fallback 0.6s 4s forwards;
      }
      #boot[data-state='done'] {
        opacity: 0;
        visibility: hidden;
      }
      #boot span {
        font: 600 13px/1 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.32em;
        color: #f7c948;
        opacity: 0.85;
      }
      #boot i {
        display: block;
        margin: 14px auto 0;
        width: 56px;
        height: 1px;
        background: linear-gradient(90deg, transparent, #f7c948, transparent);
        animation: boot-line 1.2s ease-in-out infinite;
      }
      @keyframes boot-line {
        0%, 100% { opacity: 0.2; transform: scaleX(0.4); }
        50% { opacity: 1; transform: scaleX(1); }
      }
      @keyframes boot-fallback {
        to { opacity: 0; visibility: hidden; }
      }
    </style>
    <noscript><style>#boot { display: none; }</style></noscript>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><div><span>INTELRA</span><i></i></div></div>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui; color: #f5f3ee">
        A INTELRA cria soluções digitais para empresas. Ative o JavaScript para ver o site completo ou fale conosco pelo WhatsApp.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
